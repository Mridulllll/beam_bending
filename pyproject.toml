[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "host-sandwich-theory"
version = "0.1.0"
description = "Higher-order analytical framework for sandwich structures with homogenized surface-based lattice and TPMS cores"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nikola Milenkovski" }
]
keywords = [
    "sandwich structures",
    "higher-order shear deformation theory",
    "HSDT",
    "TPMS",
    "homogenization",
    "buckling",
    "Navier method",
    "additive manufacturing",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.24",
    "sympy>=1.12",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/niko495/host-sandwich-theory"
Issues = "https://github.com/niko495/host-sandwich-theory/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]